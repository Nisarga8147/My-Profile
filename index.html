<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nisarga DC | Portfolio</title>

  <!-- TAILWIND DARK MODE -->
  <script>
    tailwind.config = {
      darkMode: "class"
    }
  </script>

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CUSTOM CSS -->
  <link rel="stylesheet" href="./css/custom.css" />

  <script>
    tailwind.config = {
      darkMode: "class"
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="
  bg-slate-50 dark:bg-[#020617]
  text-slate-800 dark:text-white
  font-sans
  scroll-smooth
  transition-all duration-300
">
<!-- SCROLL PROGRESS -->
<div id="scroll-progress-container">
  <div id="scroll-progress-bar"></div>
</div>

  <!-- SCROLL PROGRESS -->
  <div id="scroll-bar" class="
      fixed top-0 left-0
      h-1 w-0
      z-[9999]
      bg-gradient-to-r
      from-indigo-500
      via-purple-500
      to-pink-500
    ">
  </div>

  <!-- NAVBAR -->
  <nav class="
    fixed top-0 left-0
    w-full z-50
    border-b border-white/10
    backdrop-blur-xl
    bg-white/70 dark:bg-slate-900/70
  ">

    <div class="
      max-w-7xl mx-auto
      flex justify-between items-center
      px-6 md:px-10 py-5
    ">

      <!-- LOGO -->
      <h1 class="
        text-2xl font-black
        bg-gradient-to-r
        from-indigo-500
        to-purple-500
        bg-clip-text text-transparent
      ">
        NDC
      </h1>

      <!-- NAV LINKS -->
      <div class="flex items-center gap-8">

        <a href="#projects" class="nav-link">
          Projects
        </a>

        <a href="#education" class="nav-link">
          Education
        </a>

        <a href="#skills" class="nav-link">
          Skills
        </a>

        <!-- THEME -->
        <button id="theme-btn" class="
            px-5 py-2
            rounded-full
            bg-indigo-600
            text-white
            hover:bg-indigo-700
            transition
            shadow-lg
          ">
          🌙 Dark
        </button>

      </div>

    </div>

  </nav>

  <!-- HERO SECTION -->
  <section class="
    min-h-screen
    flex items-center
    px-6 pt-28
  ">

    <div class="
      max-w-7xl mx-auto
      grid md:grid-cols-2
      gap-16 items-center
    ">

      <!-- LEFT -->
      <div>

        <!-- GREETING -->
        <div id="greeting-message" class="mb-5">
        </div>

        <!-- TITLE -->
        <h1 class="
          text-5xl md:text-7xl
          font-black
          leading-tight
          mb-6
        ">
          Hi, I'm

          <span class="
            bg-gradient-to-r
            from-indigo-500
            to-purple-500
            bg-clip-text text-transparent
          ">
            Nisarga.DC
          </span>
        </h1>

        <!-- TYPING -->
        <p id="typing-text" class="
            text-lg md:text-2xl
            text-slate-600 dark:text-slate-300
            mb-8
            h-10
          ">
        </p>

        <!-- BUTTONS -->
        <div class="flex flex-wrap gap-4">

          <!-- RESUME -->
          <a href="assests/Nisarga resume .pdf" target="_blank" class="
     px-7 py-3
     rounded-full
     bg-indigo-600
     text-white
     hover:bg-indigo-700
     transition
     shadow-lg
   ">
            View Resume
          </a>
          <!-- GITHUB -->
          <a href="https://github.com/Nisarga8147/MERN_Stu_FebMay26Mys" target="_blank" class="
              px-7 py-3
              rounded-full
              border border-indigo-500
              text-indigo-500
              hover:bg-indigo-500/10
              transition
            ">
            GitHub
          </a>

          <!-- PROJECTS -->
          <a href="#projects" class="
              px-7 py-3
              rounded-full
              border border-purple-500
              text-purple-500
              hover:bg-purple-500/10
              transition
            ">
            View Projects
          </a>

        </div>

      </div>

      <!-- RIGHT IMAGE -->
      <div class="flex justify-center">

        <div class="relative">

          <!-- GLOW -->
          <div class="
            absolute inset-0
            bg-gradient-to-r
            from-indigo-500
            to-purple-500
            blur-3xl
            opacity-30
            rounded-full
          ">
          </div>

          <!-- IMAGE -->
          <img src="assests/Myphoto.jpeg" alt="Nisarga DC" class="
              relative
              w-72 h-72 md:w-96 md:h-96
              object-cover
              rounded-full
              border-4 border-indigo-400/40
              shadow-2xl
            ">

        </div>

      </div>

    </div>

  </section>

  <!-- PROJECTS -->
  <section id="projects" class="py-24 px-6">

    <div class="max-w-7xl mx-auto">

      <!-- TITLE -->
      <h2 class="
        text-4xl md:text-5xl
        font-black
        text-center
        mb-12
      ">
        My Projects
      </h2>

      <!-- SEARCH -->
      <div class="
        flex justify-center
        mb-14
      ">

        <input type="text" id="project-search" placeholder="Search projects..." class="
            w-full max-w-xl
            px-6 py-4
            rounded-2xl
            bg-white dark:bg-white/5
            border border-slate-300 dark:border-white/10
            focus:outline-none
            focus:border-indigo-500
            shadow-lg
          ">

      </div>

      <!-- PROJECT CARDS -->
      <div id="projects-container" class="
          grid grid-cols-1
          md:grid-cols-2
          lg:grid-cols-3
          gap-8
        ">
      </div>

    </div>

  </section>

  <!-- EDUCATION -->
  <section id="education" class="
      py-24 px-6
      bg-slate-100 dark:bg-slate-900/40
    ">

    <div class="max-w-6xl mx-auto">

      <h2 class="
        text-4xl md:text-5xl
        font-black
        text-center
        mb-14
      ">
        Education
      </h2>

      <div id="education-container" class="
          flex flex-col
          gap-8
        ">
      </div>

    </div>

  </section>

  <!-- SKILLS -->
  <section id="skills" class="py-24 px-6">

    <div class="max-w-7xl mx-auto">

      <h2 class="
        text-4xl md:text-5xl
        font-black
        text-center
        mb-14
      ">
        Skills
      </h2>

      <div id="skills-container">
      </div>

    </div>

  </section>

  <!-- CONTACT BUTTON -->
  <button id="contact-btn" class="
      fixed bottom-6 right-6
      w-16 h-16
      rounded-full
      bg-gradient-to-r
      from-indigo-500
      to-purple-500
      text-white text-2xl
      shadow-2xl
      hover:scale-110
      transition
      z-50
    ">
    ☏
  </button>

  <!-- CONTACT MODAL -->
<div id="contact-modal"
  class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">

  <!-- MODAL BOX -->
  <div id="modal-content"
    class="
      bg-white dark:bg-slate-900
      w-[92%] max-w-md
      p-7 rounded-3xl
      shadow-2xl
      border border-slate-200 dark:border-white/10
      relative
      scale-95 opacity-0
      transition-all duration-300
    ">

    <!-- CLOSE BUTTON -->
    <button id="close-modal"
      class="
        absolute top-4 right-5
        text-slate-600 dark:text-slate-300
        text-3xl
        font-bold
        hover:text-red-500
        transition
        cursor-pointer
      ">
      &times;
    </button>

    
    <!-- TITLE -->
    <h2 class="
      text-3xl font-bold
      text-center
      text-slate-900 dark:text-white
      mb-6
    ">
      Contact Me
    </h2>

    <!-- FORM -->
    <form
      id="contact-form"
      action="https://formspree.io/f/mvzlblga"
      method="POST"
      class="flex flex-col gap-4"
    >

      <!-- NAME -->
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Your Name"
        required
        class="
          w-full
          px-4 py-3
          rounded-xl
          border border-slate-300
          dark:border-white/10
          bg-white dark:bg-slate-800
          text-slate-900 dark:text-white
          focus:border-indigo-500
          outline-none
        "
      >

      <!-- EMAIL -->
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Your Email"
        required
        class="
          w-full
          px-4 py-3
          rounded-xl
          border border-slate-300
          dark:border-white/10
          bg-white dark:bg-slate-800
          text-slate-900 dark:text-white
          focus:border-indigo-500
          outline-none
        "
      >

      <!-- MESSAGE -->
      <textarea
        id="message"
        name="message"
        rows="4"
        placeholder="Your Message"
        required
        class="
          w-full
          px-4 py-3
          rounded-xl
          border border-slate-300
          dark:border-white/10
          bg-white dark:bg-slate-800
          text-slate-900 dark:text-white
          focus:border-indigo-500
          outline-none
          resize-none
        "
      ></textarea>

      <!-- BUTTONS -->
      <div class="flex justify-end gap-3 mt-3">

        <!-- CANCEL -->
        <button
          type="button"
          id="cancel-btn"
          class="
            px-5 py-2.5
            rounded-xl
            bg-slate-200
            dark:bg-slate-700
            text-slate-700
            dark:text-white
            hover:bg-slate-300
            dark:hover:bg-slate-600
            transition
            cursor-pointer
          ">
          Cancel
        </button>

        <!-- SUBMIT -->
        <button
          type="submit"
          class="
            px-5 py-2.5
            rounded-xl
            bg-indigo-600
            text-white
            hover:bg-indigo-700
            transition
            shadow-lg
            cursor-pointer
          ">
          Send
        </button>

      </div>

    </form>

  </div>

</div>

  <!-- JS FILES -->
  <script src="./js/data/skills.js"></script>
  <script src="./js/data/projects.js"></script>
  <script src="./js/data/educations.js"></script>

  <script src="./js/features/dynamic-greeting.js"></script>
  <script src="./js/features/typing-animation.js"></script>
  <script src="./js/features/skills-render.js"></script>
  <script src="./js/features/project-render.js"></script>
  <script src="./js/features/education-render.js"></script>
  <script src="./js/features/theme-toggle.js"></script>
  <script src="./js/features/contact-modal.js"></script>
  <script src="./js/features/geolocation-message.js"></script>
  <script src="./js/features/scroll-progress.js"></script>

  <script src="./js/main.js"></script>

</body>

</html>
